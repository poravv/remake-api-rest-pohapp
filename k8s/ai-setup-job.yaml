apiVersion: batch/v1
kind: Job
metadata:
  name: pohapp-ai-setup
  namespace: pohapp-backend
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: ai-setup
          image: ghcr.io/poravv/remake-api-rest-pohapp:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            # Esquema/vista primero; luego regen de embeddings (idempotente por
            # embedding_hash — solo re-embebe filas cuyo texto cambió).
            - >-
              node src/scripts/setup_ai.js &&
              node -e "require('./src/services/embeddingRegenService').regenerateAllEmbeddings().then((r) => { console.log('regen:', JSON.stringify(r)); process.exit(r.errors > 0 ? 1 : 0); }).catch((e) => { console.error(e.message); process.exit(1); })"
          envFrom:
            - configMapRef:
                name: pohapp-backend-config
            - secretRef:
                name: pohapp-backend-env-secrets
