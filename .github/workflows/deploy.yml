name: Pohapp Backend + Database CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Permisos mínimos necesarios para este pipeline
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NAMESPACE: pohapp-backend
  DOCKER_BUILDKIT: "1"

# Evita despliegues concurrentes sobre la misma rama
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: self-hosted
    name: Test Backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
        env:
          npm_config_cache: ${{ github.workspace }}/.npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linting
        run: |
          if grep -q "\"lint\":" package.json; then
            npm run lint || echo "Lint warnings ignored"
          else
            echo "No lint script found, skipping..."
          fi

      - name: Run tests
        run: |
          if grep -q "\"test\":" package.json; then
            npm test || echo "Tests completed"
          else
            echo "No test script found, skipping..."
          fi

  build-and-deploy:
    needs: test
    runs-on: self-hosted
    name: Build and Deploy Pohapp Backend + Database
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # nativo (permissions: packages: write); sin PAT manual

      # Versión de release desde package.json — se usa como tag human-readable
      # adicional en GHCR (v<version>). El manifiesto k8s pinnea por sha (ver
      # "Pin deployed image tag in Git manifest"); Argo ignora ese campo a
      # propósito (ignoreDifferences), el deploy real de imagen lo hace el CI.
      - name: Get app version
        id: appver
        run: echo "version=v$(grep -m1 '"version"' package.json | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=${{ steps.appver.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # --- Kubernetes deploy ---
      # Namespace la crea Argo (CreateNamespace=true en la Application pohapp).

      # Sin image pull secret: el paquete GHCR es PÚBLICO (pull anónimo).
      # Si se volviera privado, restaurar este paso con un PAT en secrets.GHCR_PAT.

      - name: Create/Update application secrets
        run: |
          set -euo pipefail
          kubectl delete secret pohapp-backend-env-secrets -n ${{ env.NAMESPACE }} --ignore-not-found=true
          kubectl create secret generic pohapp-backend-env-secrets \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=DB_HOST="${{ secrets.DB_HOST }}" \
            --from-literal=DB_PORT="${{ secrets.DB_PORT }}" \
            --from-literal=DB_USER="${{ secrets.DB_USER }}" \
            --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=DB_DATABASE="${{ secrets.DB_DATABASE }}" \
            --from-literal=DB_NAME="${{ secrets.DB_NAME }}" \
            --from-literal=MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            --from-literal=MYSQL_DATABASE="${{ secrets.MYSQL_DATABASE }}" \
            --from-literal=MYSQL_USER="${{ secrets.MYSQL_USER }}" \
            --from-literal=MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            --from-literal=NODE_ENV="production" \
            --from-literal=PORT="3000" \
            --from-literal=POHAPP_API_SECRET="${{ secrets.POHAPP_API_SECRET }}" \
            --from-literal=POHAPP_ADMIN_KEY="${{ secrets.POHAPP_ADMIN_KEY }}" \
            --from-literal=MODEL_VERSION="${{ secrets.MODEL_VERSION }}" \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --from-literal=MINIO_ACCESS_KEY="${{ secrets.MINIO_ACCESS_KEY }}" \
            --from-literal=MINIO_SECRET_KEY="${{ secrets.MINIO_SECRET_KEY }}" \
            --from-literal=MINIO_BUCKET_NAME="${{ secrets.MINIO_BUCKET_NAME }}" \
            --from-literal=MINIO_HOST="${{ secrets.MINIO_HOST }}" \
            --from-literal=MINIO_ENDPOINT="${{ secrets.MINIO_ENDPOINT }}" \
            --from-literal=MINIO_REGION="${{ secrets.MINIO_REGION }}" \
            --from-literal=ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            --from-literal=FIREBASE_SERVICE_ACCOUNT_JSON="${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}"

      - name: Create/Update Firebase service account secret
        run: |
          set -euo pipefail
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" | base64 -d > /tmp/firebase-sa.json
          kubectl create secret generic firebase-service-account \
            --from-file=service-account.json=/tmp/firebase-sa.json \
            -n ${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -
          rm /tmp/firebase-sa.json

      # configmap.yaml, mysql-deployment.yaml, redis-deployment.yaml y minio.yaml
      # (todo el path k8s/, salvo los excluidos en la Application pohapp) los
      # aplica Argo. El CI ya no los apply-ea.

      - name: Test database connection
        run: |
          set -euo pipefail
          echo "🔍 Testing database connection..."
          MYSQL_POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=mysql -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n ${{ env.NAMESPACE }} "$MYSQL_POD" -- sh -c 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"'

      # k8s/ai-setup-job.yaml está explícitamente excluido del path que
      # trackea Argo (exclude: '{...,ai-setup-job.yaml,...}' en la
      # Application pohapp) — no genera drift, Argo ni lo mira.
      - name: AI setup (schema, vista y embeddings)
        run: |
          set -euo pipefail
          echo "🧠 Running AI setup job (vista + regen embeddings, idempotente)..."
          kubectl delete job pohapp-ai-setup -n ${{ env.NAMESPACE }} --ignore-not-found=true
          kubectl apply -f k8s/ai-setup-job.yaml -n ${{ env.NAMESPACE }}
          if ! kubectl wait --for=condition=complete job/pohapp-ai-setup -n ${{ env.NAMESPACE }} --timeout=600s; then
            echo "❌ AI setup job failed"; kubectl logs job/pohapp-ai-setup -n ${{ env.NAMESPACE }} --tail=50 || true; exit 1
          fi
          kubectl logs job/pohapp-ai-setup -n ${{ env.NAMESPACE }} --tail=20

      - name: Get short SHA
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Deploy backend
        run: |
          set -euo pipefail
          # backend-deployment.yaml (k8s/) lo aplica Argo. La Application pohapp
          # tiene ignoreDifferences explicito sobre containers[0].image ("el CI
          # fija el sha, no Argo"), asi que el deploy real de imagen sigue
          # siendo responsabilidad del CI via kubectl set image.
          # TODO: quitar este kubectl set image cuando la Application pohapp
          # pase a selfHeal:true y se le saque el ignoreDifferences de
          # containers[0].image — en ese punto el sync de Argo pasa a ser el
          # deploy de imagen (pin en Git + Argo aplica). Mientras selfHeal
          # esté en false, este puente no genera drift porque el pin en Git
          # queda con el mismo sha que ya está corriendo.
          echo "📌 Pin image to current commit..."
          kubectl set image deployment/pohapp-backend \
            pohapp-backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA} \
            -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/pohapp-backend -n ${{ env.NAMESPACE }} --timeout=600s

      - name: Backend health check (ClusterIP)
        run: |
          set -euo pipefail
          echo "🏥 Checking backend health..."
          BACKEND_IP=$(kubectl get svc pohapp-backend-service -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.clusterIP}')
          for i in $(seq 1 12); do
            if curl -fsS "http://${BACKEND_IP}:3000/" > /dev/null; then
              echo "✅ Backend healthy"
              exit 0
            fi
            echo "Attempt $i/12 failed; retrying in 10s..."
            sleep 10
          done
          echo "❌ Backend health check failed"
          exit 1

      - name: Pin deployed image tag in Git manifest
        run: |
          set -euo pipefail
          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}"

          sed -i -E "s#image: ghcr\.io/poravv/remake-api-rest-pohapp:[A-Za-z0-9_.-]+#image: ${NEW_IMAGE}#" \
            k8s/backend-deployment.yaml

          if git diff --quiet -- k8s/backend-deployment.yaml; then
            echo "ℹ️ Git ya tenía el tag ${SHORT_SHA}, nada que commitear"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/backend-deployment.yaml
          git commit -m "chore(k8s): pin backend image to sha-${SHORT_SHA} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "🔎 Dumping diagnostics..."
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide
          kubectl describe deploy/mysql -n ${{ env.NAMESPACE }} || true
          kubectl describe deploy/pohapp-backend -n ${{ env.NAMESPACE }} || true
          MYSQL_POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=mysql -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$MYSQL_POD" ]; then
            echo "📜 MySQL last logs:"; kubectl logs "$MYSQL_POD" -n ${{ env.NAMESPACE }} --tail=100 || true
          fi
          APP_POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=pohapp-backend -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$APP_POD" ]; then
            echo "📜 Backend last logs:"; kubectl logs "$APP_POD" -n ${{ env.NAMESPACE }} --tail=200 || true
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo "📋 Deployment Summary:"
          echo "===================="
          echo "Job status: ${{ job.status }}"
          echo ""
          echo "📊 Pods:"
          kubectl get pods -n ${{ env.NAMESPACE }}
          echo ""
          echo "🔗 Services:"
          kubectl get svc -n ${{ env.NAMESPACE }}
          echo ""
          echo "🌐 Ingress:"
          kubectl get ingress -n ${{ env.NAMESPACE }}
